name: BackpackPlugin
version: 1.1.1
main: com.elias.backpack.BackpackPlugin
api-version: '1.21'
description: Fortgeschrittenes Backpack-Plugin mit Upgrades, Death-Handling & Admin-Einstellungen.

commands:
  backpack:
    description: Öffnet das Backpack-Menü, Upgrade-GUI oder verwalte das Backpack-Item.
    aliases: [bp]
    usage: /backpack <menu|show|hide|recover|confirmrecover>
    permission: backpack.use
  bpadmin:
    description: Verwalte Cooldowns und Upgrade-Kosten.
    usage: /bpadmin <setcooldown|setupgrade1cost|setupgrade2cost> <wert>
    permission: backpack.admin

permissions:
  backpack.use:
    default: true
  backpack.admin:
    default: op
