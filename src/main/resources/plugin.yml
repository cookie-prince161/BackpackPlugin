name: BackpackPlugin
version: 1.2.0
main: com.elias.backpack.BackpackPlugin
api-version: '1.21'
description: Fortgeschrittenes Backpack-Plugin mit Upgrades, Death-Handling & Admin-Einsichten.

commands:
  backpack:
    description: Öffnet das Backpack-Menü, den eigenen Rucksack oder den eines anderen Spielers.
    aliases: [bp, bpsee]
    usage: /backpack [menu|show|hide|recover|spieler]
    permission: backpack.use
  invsee:
    description: Öffnet das Inventar eines Online- oder Offline-Spielers.
    usage: /invsee <spieler>
    permission: backpack.admin
  enderchest:
    description: Öffnet die Enderchest eines Online- oder Offline-Spielers.
    aliases: [ec]
    usage: /enderchest [spieler]
    permission: backpack.use
  bpadmin:
    description: Verwalte Cooldowns und Upgrade-Kosten.
    usage: /bpadmin <setcooldown|setupgrade1cost|setupgrade2cost> <wert>
    permission: backpack.admin

permissions:
  backpack.use:
    default: true
  backpack.admin:
    default: op
